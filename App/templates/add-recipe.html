<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add Recipe | Ingredient App</title>
  <link href="css/styles.css" rel="stylesheet">
  <style>
    body {
      font-family: Inter, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-actions {
      margin-top: 20px;
    }

    .form-actions button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .form-actions button:hover {
      background-color: #45a049;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #4CAF50;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h2>Add New Recipe</h2>

  <form id="recipe-form" onsubmit="submitRecipe(event)">
    <div class="form-group">
      <label for="recipe-name">Recipe Name</label>
      <input type="text" id="recipe-name" required placeholder="e.g., Chicken Stir Fry" />
    </div>

    <div class="form-group">
      <label for="ingredients">Ingredients (comma-separated)</label>
      <input type="text" id="ingredients" required placeholder="e.g., chicken, soy sauce, garlic" />
    </div>

    <div class="form-group">
      <label for="instructions">Instructions</label>
      <textarea id="instructions" required placeholder="Step-by-step instructions..."></textarea>
    </div>

    <div class="form-actions">
      <button type="submit">Save Recipe</button>
    </div>
  </form>

  <a href="recipes.html" class="back-link">← Back to Recipes</a>

  <script>
    function submitRecipe(e) {
      e.preventDefault();  // Prevent the default form submission

      // Get form values
      const name = document.getElementById('recipe-name').value;
      const ingredients = document.getElementById('ingredients').value;
      const instructions = document.getElementById('instructions').value;

      // Create a recipe object
      const recipe = {
        name: name,
        ingredients: ingredients.split(',').map(item => item.trim()),  // Split ingredients into an array
        instructions: instructions
      };

      // Get existing recipes from localStorage
      let recipes = JSON.parse(localStorage.getItem('recipes')) || [];

      // Add new recipe to the array
      recipes.push(recipe);

      // Save updated recipes to localStorage
      localStorage.setItem('recipes', JSON.stringify(recipes));

      // Display a confirmation alert
      alert(`Recipe Saved:\nName: ${name}\nIngredients: ${ingredients}\nInstructions: ${instructions}`);

      // Redirect back to the recipes page
      window.location.href = 'recipes.html';
    }
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Ingredient | Ingredient App</title>
  <link href="css/styles.css" rel="stylesheet">
  <style>
    body {
      font-family: Inter, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #4CAF50;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .form-actions {
      margin-top: 20px;
    }

    .form-actions button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .form-actions button:hover {
      background-color: #45a049;
    }

    .back-link {
      display: block;
      margin-top: 20px;
      color: #4CAF50;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <h1>Add Ingredient</h1>

  <form id="ingredientForm" onsubmit="saveIngredient(event)">
    <div class="form-group">
      <label for="name">Ingredient Name</label>
      <input type="text" id="name" required placeholder="e.g., Carrots" />
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" required placeholder="e.g., 500" />
    </div>

    <div class="form-group">
      <label for="unit">Unit</label>
      <select id="unit" required>
        <option value="">--Select Unit--</option>
        <option value="g">Grams (g)</option>
        <option value="ml">Milliliters (ml)</option>
        <option value="pcs">Pieces (pcs)</option>
        <option value="cups">Cups</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit">Save Ingredient</button>
    </div>
  </form>

  <a href="inventory.html" class="back-link">← Back to Inventory</a>

  <script>
    // Function to save ingredient to localStorage
    function saveIngredient(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const qty = document.getElementById('quantity').value;
      const unit = document.getElementById('unit').value;

      // Get current ingredients from localStorage or initialize empty array
      let ingredients = JSON.parse(localStorage.getItem('ingredients')) || [];

      // Create a new ingredient object
      const newIngredient = { name, quantity: qty, unit };

      // Add the new ingredient to the ingredients array
      ingredients.push(newIngredient);

      // Save the updated ingredients array back to localStorage
      localStorage.setItem('ingredients', JSON.stringify(ingredients));

      // Optionally alert the user that the ingredient has been saved
      alert(`Ingredient Saved: ${name} - ${qty} ${unit}`);

      // Redirect to inventory page after saving
      window.location.href = 'inventory.html';
    }
  </script>

</body>
</html>
